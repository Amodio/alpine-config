name: Build Alpine ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpine-iso-release
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build and Release Alpine ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build Alpine ISO
        run: |
          docker run --privileged --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:edge sh -euxc '

              apk add --no-cache \
                alpine-conf \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools \
                abuild \
                git

              # Create build user
              adduser -D -G abuild builder

              # Generate & install signing key
              su - builder -c "abuild-keygen -a -n"
              cp -f /home/builder/.config/abuild/*.rsa.pub /etc/apk/keys/

              # Permissions
              chown builder:abuild /workspace/

              # Build as non-root
              su builder -c "
                export PACKAGER_PRIVKEY=/home/builder/.config/abuild/*.rsa
                cd /workspace &&
                git clone --depth=1 https://github.com/alpinelinux/aports.git &&
                ln -s /workspace/genapkovl-amodio.sh aports/scripts/ &&
                ln -s /workspace/mkimg.amodio.sh aports/scripts/ &&
                ln -s /workspace/autoinstall.sh aports/scripts/ &&
                ln -s /workspace/local_files/ aports/scripts/ &&
                ./aports/scripts/mkimage.sh \
                  --tag edge \
                  --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
                  --profile amodio
              "
              # Restore ownership of all workspace files to the GitHub runner
              chown -R "${HOST_UID}:${HOST_GID}" /workspace
            '

      - name: Calculate Release Number
        id: release-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_COUNT=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'length' | awk '{sum += $1} END {print sum+0}')

          RELEASE_NUMBER=$((RELEASE_COUNT + 1))

          echo "number=$RELEASE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Next release number: $RELEASE_NUMBER"

      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git tag --list 'release-*' --sort=-version:refname | sed -n '1p')

          {
            echo "Automated Alpine Linux ISO build."
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo "Release: ${{ steps.release-number.outputs.number }}"
            echo ""

            echo "## Commits"

            if [ -n "$PREVIOUS_TAG" ]; then
              echo ""
              echo "Changes since **${PREVIOUS_TAG}**:"
              echo ""

              git log "${PREVIOUS_TAG}..${GITHUB_SHA}" \
                --pretty=format:"- [%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H) %s"
            else
              echo ""
              echo "Initial release: all repository commits."
              echo ""

              git log "${GITHUB_SHA}" \
                --pretty=format:"- [%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H) %s"
            fi

            echo ""
          } > release-notes.md

          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ steps.release-number.outputs.number }}
          name: "Alpine Amodio Release #${{ steps.release-number.outputs.number }}"
          body_path: release-notes.md
          files: alpine-amodio-edge-x86_64.iso
          make_latest: true
          fail_on_unmatched_files: true
