
name: Build Alpine ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build and Release Alpine ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Alpine ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:edge sh -euxc '

              apk add --no-cache \
                alpine-conf \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools \
                abuild \
                git \
                sudo

              # Create build user
              adduser -D -G abuild builder

              # Prepare scripts
              git clone --depth=1 \
                https://github.com/alpinelinux/aports.git

              ln -s /workspace/genapkovl-amodio.sh \
                aports/scripts/genapkovl-amodio.sh

              ln -s /workspace/mkimg.amodio.sh \
                aports/scripts/mkimg.amodio.sh

              ln -s /workspace/autoinstall.sh \
                aports/scripts/autoinstall.sh

              ln -s /workspace/local_files \
                aports/scripts/local_files

              # Set permissions
              chown -R builder:abuild /workspace/aports

              # Generate signing key
              abuild-keygen -a -i -n
              mkdir -p /home/builder/.config/
              cp -rf /root/.config/abuild/ /home/builder/.config/
              chown -R builder:abuild /home/builder/.config/abuild/

              # Build as non-root
              su builder -c "
                abuild-keygen -a -n &&
                cd /workspace &&
                ./aports/scripts/mkimage.sh \
                  --tag edge \
                  --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
                  --profile amodio
              "
            '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alpine Amodio Build #${{ github.run_number }}
          body: |
            Automated Alpine Linux ISO build.

            Commit: ${{ github.sha }}
            Build: ${{ github.run_number }}

          files: alpine-amodio-edge-x86_64.iso
          make_latest: true
          fail_on_unmatched_files: true
