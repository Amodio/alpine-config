
name: Build Alpine ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build and Release Alpine ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Alpine ISO
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:edge sh -euxc '

              apk add --no-cache \
                alpine-conf \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools \
                abuild \
                git

              # Create build user
              adduser -D -G abuild builder

              # Generate & install signing key
              su - builder -c 'abuild-keygen -a -n'
              cp -f /home/builder/.config/abuild/*.rsa.pub /etc/apk/keys/

              # Build as non-root
              su builder -c "
                git clone --depth=1 https://github.com/alpinelinux/aports.git &&
                ln -s /workspace/genapkovl-amodio.sh aports/scripts/ &&
                ln -s /workspace/mkimg.amodio.sh aports/scripts/ &&
                ln -s /workspace/autoinstall.sh aports/scripts/ &&
                ln -s /workspace/local_files/ aports/scripts/ &&
                cd /workspace &&
                ./aports/scripts/mkimage.sh \
                  --tag edge \
                  --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
                  --profile amodio
              "
            '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alpine Amodio Build #${{ github.run_number }}
          body: |
            Automated Alpine Linux ISO build.

            Commit: ${{ github.sha }}
            Build: ${{ github.run_number }}

          files: alpine-amodio-edge-x86_64.iso
          make_latest: true
          fail_on_unmatched_files: true
